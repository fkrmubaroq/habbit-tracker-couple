# Contoh konfigurasi Nginx untuk Habbit Tracker
# Letakkan di /etc/nginx/sites-available/habbit-tracker
# Lalu symlink ke /etc/nginx/sites-enabled/habbit-tracker
#
# Tiga app berjalan di belakang satu domain:
#   /                  -> habbit-tracker-web   (frontend/dist)   + habbit-tracker-api   (127.0.0.1:1906)
#   /grocery/          -> grocery-tracker-web  (grocery-frontend/dist) + grocery-tracker-api (127.0.0.1:5052)
#   /api/grocery/      -> grocery-tracker-api  (127.0.0.1:5052)
#   /pomodoro/         -> pomodoro-tracker-web (pomodoro-frontend/dist) + pomodoro-tracker-api (127.0.0.1:5053)
#   /api/pomodoro/     -> pomodoro-tracker-api (127.0.0.1:5053)

server {
    listen 1905;
    server_name _; # Ganti dengan domain atau IP VPS Anda

    # Frontend (React Vite SPA)
    location / {
        root /var/www/habbit-tracker/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Grocery API — harus dideklarasikan sebelum /api/ agar menang (prefix terpanjang)
    location /api/grocery/ {
        proxy_pass http://127.0.0.1:5052/api/grocery/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Pomodoro API — juga harus sebelum /api/ (prefix terpanjang)
    location /api/pomodoro/ {
        proxy_pass http://127.0.0.1:5053/api/pomodoro/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API Proxy (Express)
    location /api/ {
        proxy_pass http://127.0.0.1:1906/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Grocery frontend (SPA) — dibangun dengan base "/grocery/"
    location = /grocery {
        return 301 /grocery/;
    }

    # `^~` wajib: tanpa itu blok regex static di bawah akan menangkap
    # /grocery/assets/*.js dan menyajikannya dari dist milik app habit.
    location ^~ /grocery/ {
        alias /var/www/habbit-tracker/grocery-frontend/dist/;
        index index.html;
        try_files $uri $uri/ /grocery/index.html;
    }

    # Pomodoro frontend (SPA) — dibangun dengan base "/pomodoro/"
    location = /pomodoro {
        return 301 /pomodoro/;
    }

    location ^~ /pomodoro/ {
        alias /var/www/habbit-tracker/pomodoro-frontend/dist/;
        index index.html;
        try_files $uri $uri/ /pomodoro/index.html;
    }

    # Static caching (opsional)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/habbit-tracker/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
